<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../fonts/inter-latin.woff2) format("woff2");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;background:radial-gradient(900px 700px at 70% 40%,#3a0d12 0%,#0b0d12 65%)}
.t{position:absolute;left:60px;top:150px;font-weight:900;font-size:150px;line-height:.92;letter-spacing:-5px;text-shadow:0 8px 0 #000,0 0 40px rgba(0,0,0,.8)}
.t em{font-style:normal;color:#ff3b3b}
.phone{position:absolute;left:760px;top:60px;width:440px;height:760px;border-radius:56px;background:#05060a;border:9px solid #3a4152;transform:rotate(6deg);box-shadow:0 30px 90px rgba(0,0,0,.8)}
.bar{height:90px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;color:#9aa3b5;font-weight:700;font-size:24px;border-bottom:2px solid #161a24}
.bub{position:absolute;left:22px;top:130px;background:#262b37;border-radius:30px;border-bottom-left-radius:8px;padding:24px 28px;font-size:44px;font-weight:600;line-height:1.2;box-shadow:0 0 0 7px #ff3b3b}
.n{position:absolute;left:66px;top:520px;background:#ff3b3b;font-weight:900;font-size:44px;padding:8px 22px;border-radius:12px}
</style></head><body>
<div class="phone"><div class="bar">Unknown number</div><div class="bub">Hi, is this Anna? 🙂</div></div>
<div class="t">WRONG<br><em>NUMBER?</em></div>
</body></html>
