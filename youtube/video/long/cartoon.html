<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(../fonts/inter-latin.woff2) format("woff2");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff;font-family:Inter,sans-serif}
svg{position:absolute;inset:0}
.bub{background:#fff;border:6px solid #1b1b2f;border-radius:34px;padding:22px 28px;font:600 34px/1.25 Inter;color:#1b1b2f}
.link{color:#1f5fd1;text-decoration:underline;word-break:break-all}
.page{width:100%;height:100%;background:#f4f6fb;font:500 30px/1.3 Inter;color:#1b1b2f;padding:26px}
.cap{position:absolute;left:80px;right:80px;top:965px;text-align:center;font:900 54px/1.1 Inter;text-transform:uppercase;color:#fff;
 -webkit-text-stroke:10px #1b1b2f;paint-order:stroke fill}
.cap span.on{color:#ffd60a}
</style></head>
<body>
<svg id="st" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<div class="cap" id="cap"></div>
<script>
const OL='#1b1b2f';
let T,AMP,FPS=30;
window.setup=(tl,amp)=>{T=tl;AMP=amp};
const cl=x=>Math.max(0,Math.min(1,x)), e3=x=>1-Math.pow(1-x,3);
const back=x=>{const c=2.2;x=x-1;return 1+(c+1)*x*x*x+c*x*x};
const P=(t,a,d=.4)=>cl((t-a)/d);
const pop=(t,a,d=.45)=>{const p=P(t,a,d);return p<=0?0:p>=1?1:back(p)};
const lerp=(a,b,p)=>a+(b-a)*p;
const amp=t=>AMP[Math.max(0,Math.min(AMP.length-1,Math.floor(t*FPS)))]||0;
const blink=(t,s=0)=>((t+s)%3.4)<.12?.1:1;
const fo=(x,y,w,h,html,extra='')=>`<foreignObject x="${x}" y="${y}" width="${w}" height="${h}" ${extra}><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%">${html}</div></foreignObject>`;
const title=(x,y,txt,size=96,fill='#ffd60a',sc=1,rot=0)=>`<g transform="translate(${x},${y}) rotate(${rot}) scale(${sc})"><text text-anchor="middle" font-family="Inter" font-weight="900" font-size="${size}" fill="${fill}" stroke="${OL}" stroke-width="${size/7}" paint-order="stroke" stroke-linejoin="round">${txt}</text></g>`;
const G=(x,y,s,inner,rot=0)=>`<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})">${inner}</g>`;

/* ---------- characters ---------- */
function eyes(t,look,shock,seed,dx=26,col=OL){
  const b=blink(t,seed),ry=16+shock*7,rx=12+shock*4;
  return [-dx,dx].map(ex=>`<g transform="translate(${ex},-8) scale(1,${b})"><ellipse rx="${rx}" ry="${ry}" fill="#fff" stroke="${OL}" stroke-width="5"/><circle cx="${look*5}" cy="2" r="${7-shock*1.5}" fill="${col}"/></g>`).join('');
}
function sam(o){
  const {t=0,look=0,shock=0,happy=0,mouth=0,phone=true,shrug=0,wave=0}=o, bob=Math.sin(t*2.4)*4;
  const mo=shock>.3?`<ellipse cx="0" cy="38" rx="${10+shock*6}" ry="${8+shock*14}" fill="#7a1f1f" stroke="${OL}" stroke-width="5"/>`
     :`<path d="M-22 30 Q0 ${48+happy*14+mouth*10} 22 30" fill="${mouth>.1||happy>.5?'#7a1f1f':'none'}" stroke="${OL}" stroke-width="6" stroke-linecap="round"/>`;
  const armL=shrug?`M-62 -40 Q-130 -60 -120 -130`:`M-62 -40 Q-90 20 -30 40`;
  const armR=wave?`M62 -40 Q130 -80 ${120+Math.sin(t*12)*14} -150`:shrug?`M62 -40 Q130 -60 120 -130`:`M62 -40 Q90 20 30 40`;
  return `<g transform="translate(0,${bob})">
   <ellipse cx="0" cy="190" rx="90" ry="14" fill="rgba(0,0,0,.15)"/>
   <rect x="-46" y="50" width="40" height="130" rx="18" fill="#2b2d42" stroke="${OL}" stroke-width="6"/>
   <rect x="6" y="50" width="40" height="130" rx="18" fill="#2b2d42" stroke="${OL}" stroke-width="6"/>
   <ellipse cx="-30" cy="182" rx="32" ry="15" fill="#fff" stroke="${OL}" stroke-width="6"/><ellipse cx="30" cy="182" rx="32" ry="15" fill="#fff" stroke="${OL}" stroke-width="6"/>
   <rect x="-72" y="-90" width="144" height="165" rx="52" fill="#3a86ff" stroke="${OL}" stroke-width="6"/>
   <path d="${armL}" stroke="${OL}" stroke-width="36" fill="none" stroke-linecap="round"/><path d="${armL}" stroke="#3a86ff" stroke-width="24" fill="none" stroke-linecap="round"/>
   <path d="${armR}" stroke="${OL}" stroke-width="36" fill="none" stroke-linecap="round"/><path d="${armR}" stroke="#3a86ff" stroke-width="24" fill="none" stroke-linecap="round"/>
   ${phone&&!shrug?`<rect x="-26" y="0" width="52" height="84" rx="10" fill="#222" stroke="${OL}" stroke-width="5" transform="rotate(-8)"/><rect x="-18" y="8" width="36" height="62" rx="5" fill="#9fd3ff" transform="rotate(-8)"/>`:''}
   <g transform="translate(0,-170)">
     <circle cx="-80" cy="0" r="18" fill="#f2c6a0" stroke="${OL}" stroke-width="5"/><circle cx="80" cy="0" r="18" fill="#f2c6a0" stroke="${OL}" stroke-width="5"/>
     <circle r="82" fill="#f2c6a0" stroke="${OL}" stroke-width="6"/>
     <path d="M-82 -10 Q-80 -95 0 -88 Q85 -95 82 -10 Q60 -60 10 -52 Q-50 -66 -82 -10Z" fill="#5a3825" stroke="${OL}" stroke-width="6"/>
     <path d="M-44 ${-38-shock*12} l30 ${-4+shock*2}" stroke="${OL}" stroke-width="7" stroke-linecap="round"/><path d="M14 ${-42-shock*12} l30 ${4-shock*2}" stroke="${OL}" stroke-width="7" stroke-linecap="round"/>
     ${eyes(t,look,shock,.3)}
     <ellipse cx="-50" cy="22" rx="14" ry="8" fill="#ff8fa3" opacity=".6"/><ellipse cx="50" cy="22" rx="14" ry="8" fill="#ff8fa3" opacity=".6"/>
     ${mo}
   </g></g>`;
}
function fox(o){
  const {t=0,run=0,laugh=0,hat=0,sack=0,sackS=1,head=false,sil=false}=o;
  const bob=run?Math.abs(Math.sin(t*14))*-16:Math.sin(t*2)*4 + (laugh?Math.abs(Math.sin(t*16))*-10:0);
  const F=sil?'#2a2440':'#ff7b29', W=sil?'#2a2440':'#fff', H=sil?'#2a2440':'#4b2e83';
  const ls=run?Math.sin(t*20)*35:0, tail=Math.sin(t*3.2)*14;
  const headG=`<g transform="translate(0,-165)">
     <path d="M-70 -30 L-90 -120 L-25 -70Z" fill="${F}" stroke="${OL}" stroke-width="6" stroke-linejoin="round"/><path d="M70 -30 L90 -120 L25 -70Z" fill="${F}" stroke="${OL}" stroke-width="6" stroke-linejoin="round"/>
     <path d="M-95 -20 Q-90 -85 0 -82 Q90 -85 95 -20 Q90 50 0 75 Q-90 50 -95 -20Z" fill="${F}" stroke="${OL}" stroke-width="6"/>
     <path d="M-60 15 Q0 -10 60 15 Q40 70 0 75 Q-40 70 -60 15Z" fill="${W}"/>
     ${sil?'':`<path d="M-50 -12 Q-30 -26 -10 -12" stroke="${OL}" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M10 -12 Q30 -26 50 -12" stroke="${OL}" stroke-width="7" fill="none" stroke-linecap="round"/>
     <ellipse cx="-30" cy="-2" rx="11" ry="${7*blink(t,1.1)}" fill="#ffd60a" stroke="${OL}" stroke-width="4"/><ellipse cx="30" cy="-2" rx="11" ry="${7*blink(t,1.1)}" fill="#ffd60a" stroke="${OL}" stroke-width="4"/>
     <ellipse cx="0" cy="22" rx="14" ry="10" fill="${OL}"/>
     <path d="M-36 40 Q0 ${70+laugh*16} 36 40 Z" fill="#7a1f1f" stroke="${OL}" stroke-width="5" stroke-linejoin="round"/><path d="M-24 44 L-18 54 L-12 46 M12 46 L18 54 L24 44" stroke="#fff" stroke-width="5" fill="none"/>`}
     ${hat?`<path d="M-80 -60 Q0 -130 80 -60Z" fill="#ffb000" stroke="${OL}" stroke-width="6"/><rect x="-100" y="-66" width="150" height="20" rx="10" fill="#ffb000" stroke="${OL}" stroke-width="6"/><text x="0" y="-78" text-anchor="middle" font-family="Inter" font-weight="900" font-size="22" fill="${OL}">PARCEL</text>`:''}
   </g>`;
  if(head)return `<g transform="translate(0,${bob})">${headG}</g>`;
  return `<g transform="translate(0,${bob})">
   <ellipse cx="0" cy="${190-bob}" rx="90" ry="14" fill="rgba(0,0,0,.15)"/>
   <g transform="translate(-60,40) rotate(${tail-30})"><path d="M0 0 Q-120 -20 -150 -110 Q-90 -90 -40 -60 Q-10 -30 0 0Z" fill="${F}" stroke="${OL}" stroke-width="6"/><path d="M-150 -110 Q-125 -95 -118 -70 Q-140 -78 -150 -110Z" fill="${W}"/></g>
   <g transform="translate(-24,60) rotate(${ls})"><rect x="-18" y="0" width="36" height="110" rx="16" fill="${H}" stroke="${OL}" stroke-width="6"/><ellipse cx="0" cy="116" rx="28" ry="14" fill="${OL}"/></g>
   <g transform="translate(24,60) rotate(${-ls})"><rect x="-18" y="0" width="36" height="110" rx="16" fill="${H}" stroke="${OL}" stroke-width="6"/><ellipse cx="0" cy="116" rx="28" ry="14" fill="${OL}"/></g>
   <rect x="-75" y="-95" width="150" height="170" rx="55" fill="${H}" stroke="${OL}" stroke-width="6"/>
   <path d="M-40 -95 Q0 -40 40 -95" fill="none" stroke="${OL}" stroke-width="5"/>
   ${sack?`<g transform="translate(110,20) scale(${sackS})"><path d="M-55 -40 Q-80 70 0 75 Q80 70 55 -40 Q0 -20 -55 -40Z" fill="#c8a165" stroke="${OL}" stroke-width="6"/><path d="M-30 -48 L30 -48" stroke="${OL}" stroke-width="10" stroke-linecap="round"/><text x="0" y="40" text-anchor="middle" font-family="Inter" font-weight="900" font-size="54" fill="#2e7d32">$</text></g>`:''}
   ${headG}</g>`;
}
function mascot(o){
  const {t=0,a=0,wave=1,thumbs=0,glass=0}=o, bob=Math.sin(t*3)*6, m=4+a*34;
  const arm=Math.sin(t*4)*20*wave;
  return `<g transform="translate(0,${bob})">
   <ellipse cx="0" cy="205" rx="80" ry="12" fill="rgba(0,0,0,.15)"/>
   <rect x="-40" y="150" width="22" height="50" rx="10" fill="${OL}"/><rect x="18" y="150" width="22" height="50" rx="10" fill="${OL}"/>
   <path d="M-95 0 Q-150 ${-40+arm} -140 ${-110+arm}" stroke="${OL}" stroke-width="18" fill="none" stroke-linecap="round"/><circle cx="-140" cy="${-115+arm}" r="18" fill="#fff" stroke="${OL}" stroke-width="5"/>
   ${glass?`<path d="M95 0 Q150 -20 170 -60" stroke="${OL}" stroke-width="18" fill="none" stroke-linecap="round"/><g transform="translate(200,-110)"><circle r="60" fill="rgba(160,210,255,.35)" stroke="${OL}" stroke-width="12"/><path d="M-40 45 L-90 100" stroke="#8b5a2b" stroke-width="22" stroke-linecap="round"/></g>`
     :`<path d="M95 0 Q150 20 ${150} ${thumbs?-60:70}" stroke="${OL}" stroke-width="18" fill="none" stroke-linecap="round"/><circle cx="150" cy="${thumbs?-70:78}" r="20" fill="#fff" stroke="${OL}" stroke-width="5"/>${thumbs?`<rect x="140" y="-115" width="18" height="40" rx="9" fill="#fff" stroke="${OL}" stroke-width="5"/>`:''}`}
   <rect x="-100" y="-170" width="200" height="330" rx="42" fill="#1f7aff" stroke="${OL}" stroke-width="7"/>
   <rect x="-80" y="-140" width="160" height="250" rx="24" fill="#e8f1ff" stroke="${OL}" stroke-width="5"/>
   <circle cx="0" cy="135" r="10" fill="#cfe2ff" stroke="${OL}" stroke-width="4"/>
   <g transform="translate(0,-50)">${eyes(t,Math.sin(t*.7)*.6,0,2.1,30)}</g>
   <ellipse cx="-48" cy="-10" rx="14" ry="8" fill="#ff8fa3" opacity=".7"/><ellipse cx="48" cy="-10" rx="14" ry="8" fill="#ff8fa3" opacity=".7"/>
   <ellipse cx="0" cy="20" rx="${22+a*6}" ry="${m/2}" fill="#7a1f1f" stroke="${OL}" stroke-width="5"/>
  </g>`;
}

/* ---------- backgrounds & props ---------- */
const sun=(t,c1,c2)=>{let r=`<rect width="1920" height="1080" fill="${c1}"/>`;
  for(let i=0;i<16;i++){const a=i*22.5+t*6;r+=`<path d="M960 540 L${960+2400*Math.cos(a*Math.PI/180)} ${540+2400*Math.sin(a*Math.PI/180)} L${960+2400*Math.cos((a+10)*Math.PI/180)} ${540+2400*Math.sin((a+10)*Math.PI/180)}Z" fill="${c2}"/>`}return r};
function room(t,{door=0,clock=0,piggy=1,win=1}={}){
  const h=t*30;
  return `<rect width="1920" height="1080" fill="#ffe8d6"/><rect y="760" width="1920" height="320" fill="#e9b88a"/><rect y="750" width="1920" height="20" fill="#c98f5c"/>
  ${win?`<g transform="translate(1180,170)"><rect width="420" height="320" rx="16" fill="#9fd8ff" stroke="${OL}" stroke-width="8"/><circle cx="330" cy="80" r="40" fill="#ffd60a"/><path d="M0 250 Q100 200 200 240 T420 230 L420 320 L0 320Z" fill="#7bd389"/><path d="M210 0 V320 M0 160 H420" stroke="${OL}" stroke-width="8"/></g>`:''}
  ${door?`<g transform="translate(140,250)"><rect width="300" height="510" rx="10" fill="#b5651d" stroke="${OL}" stroke-width="8"/><rect x="30" y="30" width="240" height="200" rx="10" fill="none" stroke="${OL}" stroke-width="5"/><circle cx="250" cy="290" r="16" fill="#ffd60a" stroke="${OL}" stroke-width="5"/></g>`:''}
  ${clock?`<g transform="translate(760,200)"><circle r="80" fill="#fff" stroke="${OL}" stroke-width="8"/><path d="M0 0 L0 -50" stroke="${OL}" stroke-width="8" stroke-linecap="round" transform="rotate(${h})"/><path d="M0 0 L35 0" stroke="${OL}" stroke-width="8" stroke-linecap="round" transform="rotate(${h/12})"/></g>`:''}
  ${piggy?`<rect x="1170" y="560" width="440" height="22" rx="8" fill="#8b5a2b" stroke="${OL}" stroke-width="6"/>
    <g transform="translate(1390,500)"><ellipse rx="80" ry="58" fill="#ff8fb1" stroke="${OL}" stroke-width="7"/><ellipse cx="78" cy="0" rx="22" ry="18" fill="#ff8fb1" stroke="${OL}" stroke-width="6"/><circle cx="30" cy="-18" r="7" fill="${OL}"/><rect x="-14" y="-62" width="34" height="8" rx="4" fill="${OL}"/><rect x="-55" y="45" width="22" height="22" fill="#ff8fb1" stroke="${OL}" stroke-width="6"/><rect x="30" y="45" width="22" height="22" fill="#ff8fb1" stroke="${OL}" stroke-width="6"/><text y="15" text-anchor="middle" font-family="Inter" font-weight="900" font-size="22" fill="${OL}">SAVINGS</text></g>`:''}`;
}
const cardG=(icon,label,dark=false)=>`<rect x="-100" y="-140" width="200" height="280" rx="24" fill="${dark?'#2a2440':'#fff'}" stroke="${OL}" stroke-width="7"/>
  <text y="10" text-anchor="middle" font-size="96">${icon}</text><text y="105" text-anchor="middle" font-family="Inter" font-weight="800" font-size="26" fill="${dark?'#fff':OL}">${label}</text>`;
const coin=(txt)=>`<circle r="70" fill="#ffd60a" stroke="${OL}" stroke-width="8"/><circle r="52" fill="none" stroke="#e0a800" stroke-width="6"/><text y="16" text-anchor="middle" font-family="Inter" font-weight="900" font-size="44" fill="${OL}">${txt}</text>`;
const credit=`<rect x="-120" y="-75" width="240" height="150" rx="18" fill="#4361ee" stroke="${OL}" stroke-width="7"/><rect x="-90" y="-40" width="50" height="38" rx="6" fill="#ffd60a" stroke="${OL}" stroke-width="4"/><text x="-90" y="45" font-family="Inter" font-weight="800" font-size="24" fill="#fff">4921 •••• 7730</text>`;
const flash=(lt,a)=>{const p=P(lt,a,.18);return p>0&&p<1?`<rect width="1920" height="1080" fill="#fff" opacity="${(1-p)*.8}"/>`:''};

/* ---------- beats ---------- */
function beat0(lt,b,t){
  const S=i=>b.sents[i].start; let s=room(lt,{});
  const pos=[[1240,330],[1330,300],[1420,330],[1510,300],[1600,330],[300,620],[1720,700]];
  pos.slice(0,6).forEach((p,i)=>{const k=pop(lt,S(0)+1.2+i*.25);if(k>0)s+=G(p[0],p[1]+(1-k)*80,.38*k,fox({t:lt+i,head:true}))});
  const k7=pop(lt,S(1));if(k7>0)s+=G(1720,640,.6*k7*(1+.06*Math.sin(lt*8)),fox({t:lt,sil:true}))+title(1720,330,'?',150,'#ff3b3b',k7);
  const shock=P(lt,S(1),.25), buzz=lt>.4&&lt<1.4?Math.sin(lt*80)*4:0;
  s+=G(820+buzz,560,1.05,sam({t:lt,shock,look:shock?1:0}));
  if(lt>.4&&lt<1.6)s+=title(900,300,'BZZT!',60,'#fff',pop(lt,.4),-8);
  s+=title(960,130,'7 SCAMS',110,'#ffd60a',pop(lt,S(0)+.6),-3);
  return s;
}
function beat1(lt,b,t){
  const S=i=>b.sents[i].start; let s=sun(lt,'#7b2cbf','#8f3fd6');
  const C=[['📦','Delivery'],['☎️','Bank call'],['💬','"Hi Mum"'],['💼','Easy job'],['🛒','Keen buyer'],['🖥️','Frozen screen'],['🔒','???']];
  C.forEach((c,i)=>{const k=e3(P(lt,S(0)+.3+i*.22,.5));if(k<=0)return;
    const x=lerp(2200,760+i*165,k),y=520+Math.abs(i-3)*22,r=(i-3)*6;
    let sc=1,rr=r; if(i===6&&lt>S(1)){rr=r+Math.sin(lt*10)*8;sc=1+.08*Math.sin(lt*6)}
    s+=G(x,y,sc,(i===6&&lt>S(1)?`<rect x="-112" y="-152" width="224" height="304" rx="30" fill="#ff3b3b" opacity="${.5+.3*Math.sin(lt*8)}"/>`:'')+cardG(c[0],c[1],i===6),rr)});
  s+=G(320,620,1.15*pop(lt,0),mascot({t:lt,a:amp(t)}));
  if(lt>S(1))s+=title(1260,230,'COSTS THE MOST',70,'#ff3b3b',pop(lt,S(1)+.3),-4);
  else s+=title(1260,230,'7 SCAMS · 7 TELLS',70,'#ffd60a',pop(lt,S(0)+.2),-3);
  return s;
}
function beat2(lt,b,t){
  const S=i=>b.sents[i].start; let s='';
  if(lt<S(2)){ // title card
    s+=sun(lt,'#ffb000','#ffc233');
    const k=pop(lt,0),jump=Math.abs(Math.sin(lt*5))*-60;
    s+=G(960,560+jump,1.4*k,`<rect x="-120" y="-90" width="240" height="180" rx="10" fill="#c8a165" stroke="${OL}" stroke-width="8"/><path d="M-120 -40 H120 M-25 -90 V90" stroke="#8b6a3a" stroke-width="16"/>${eyes(lt,0,0,.5,40)}<path d="M-20 40 Q0 58 20 40" stroke="${OL}" stroke-width="6" fill="none"/>`,Math.sin(lt*5)*6);
    s+=title(960,250,'#1',120,'#fff',pop(lt,.1),-5)+title(960,900,'THE DELIVERY TEXT',96,'#ffd60a',pop(lt,.4));
    return s;
  }
  if(lt<S(5)){ // waiting at home, text arrives
    s+=room(lt,{door:1,clock:1,piggy:0,win:0});
    const wait=lt<S(2)+.5;
    s+=G(620,560,1,sam({t:lt,look:-1,happy:lt>S(4)?1:0}));
    const kb=pop(lt,S(2)+.2);
    if(kb>0)s+=G(1240,420,kb,fo(-380,-230,760,460,`<div class="bub">📱 <b>Parcel Service:</b> Your parcel could not be delivered. Update your address here: <span class="link">parcel-redelivery-update.info/xk29</span></div>`));
    if(lt>S(4)){const k=pop(lt,S(4));s+=G(520,170,k,`<ellipse rx="160" ry="100" fill="#fff" stroke="${OL}" stroke-width="7"/><circle cx="60" cy="150" r="18" fill="#fff" stroke="${OL}" stroke-width="6"/><circle cx="90" cy="190" r="10" fill="#fff" stroke="${OL}" stroke-width="5"/><text y="30" text-anchor="middle" font-size="90">📦❤️</text>`)}
    s+=flash(lt,S(2));
    return s;
  }
  if(lt<S(9)){ // fake page, fox behind it, small fee
    s+=sun(lt,'#3a86ff','#4d94ff');
    const z=e3(P(lt,S(5),.5));
    const peek=e3(P(lt,S(5)+1.6,.6));
    s+=G(1130+peek*230,600,1.05,fox({t:lt,laugh:lt>S(8)?1:0}),peek*-12);
    s+=G(960,540,lerp(.6,1,z),`<rect x="-270" y="-470" width="540" height="940" rx="60" fill="#111" stroke="${OL}" stroke-width="10"/>`+fo(-245,-430,490,860,`<div class="page"><div style="background:#ffb000;font-weight:900;font-size:36px;padding:10px 16px;border-radius:12px;display:inline-block;border:4px solid #1b1b2f">PARCEL SERVICE</div><p style="margin-top:22px;color:#555">Tracking: PX-4471-208</p><p style="color:#d00;font-weight:800">Delivery failed</p><p style="margin-top:20px;font-weight:800;font-size:34px">Redelivery fee: $1.99</p><div style="margin-top:20px;border:3px solid #ccd;border-radius:12px;padding:14px;color:#999;background:#fff">Card number</div><div style="margin-top:12px;border:3px solid #ccd;border-radius:12px;padding:14px;color:#999;background:#fff">MM / YY · CVV</div><div style="margin-top:22px;background:#ffb000;border:4px solid #1b1b2f;border-radius:14px;padding:16px;text-align:center;font-weight:900">PAY $1.99</div></div>`));
    if(lt>S(7)){const k=pop(lt,S(7)),j=Math.abs(Math.sin((lt-S(7))*6))*-40*Math.max(0,1-(lt-S(7))/2);s+=G(500,560+j,1.3*k,coin('$1.99'))}
    if(lt>S(8))s+=G(380,900,.8,fo(-260,-70,520,140,`<div class="bub" style="text-align:center">"Eh, it's only $1.99." 🤷</div>`),0);
    if(lt>S(5)+1.6)s+=title(1530,240,'SNEAKY!',64,'#ff3b3b',pop(lt,S(5)+1.8),8);
    s+=flash(lt,S(5));
    return s;
  }
  if(lt<S(11)){ // card flies to the fox's sack
    s+=room(lt,{piggy:1,win:1});
    const fly=P(lt,S(10)+.3,1.2), e=e3(fly);
    const grow=1+e*.6;
    s+=G(480,560,1,sam({t:lt,shock:fly>.6?1:0,look:1}));
