<script>
let T;
const $=id=>document.getElementById(id);
const cl=x=>Math.max(0,Math.min(1,x)), e3=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.9;x=x-1;return 1+(c+1)*x*x*x+c*x*x};
const P=(t,a,d=.35)=>cl((t-a)/d);
const pop=(t,a,d=.4)=>{const p=P(t,a,d);return p<=0?0:p>=1?1:back(p)};
const st=(t,a)=>`opacity:${Math.min(1,P(t,a,.25)*2)};transform:translateY(${(1-e3(P(t,a,.4)))*40}px) scale(${pop(t,a)||.001})`;
const lerp=(a,b,p)=>a+(b-a)*p;
const col={red:'#ff3b3b',green:'#30d158',yellow:'#ffd60a',teal:'#1ee3cf',blue:'#1f7aff'};
const ink={red:'#fff',green:'#06210f',yellow:'#111',teal:'#071a1a',blue:'#fff'};
window.setup=tl=>{T=tl};
function stag(o,i,n,s){return (o.at??.3)+i*((s.dur*.85-(o.at??.3))/Math.max(1,n))}
function cards(o,lt){const C=o.items,cols=Math.min(4,C.length);return C.map((c,i)=>{const p=e3(P(lt,.1+i*.12,.45)),x=960-cols*145+(i%cols)*290,y=(o.h?250:200)+Math.floor(i/cols)*200;
  const g=i==o.glow?`box-shadow:0 0 0 8px #ffd60a,0 14px 40px rgba(0,0,0,.6);transform:translateX(${(1-p)*-500}px) scale(${1+.05*Math.sin(lt*6)})`:`transform:translateX(${(1-p)*-500}px)`;
  return `<div class="mini" style="left:${x}px;top:${y}px;opacity:${p>0?1:0};${c[2]?'background:#2a2440;color:#fff;':''}${g}"><b>${c[0]}</b>${c[1]}${i<(o.ticks||0)?'<div class="ok">✓</div>':''}</div>`}).join('')+(o.h?`<div class="ttl" style="top:90px;font-size:86px;${st(lt,.2)}">${o.h}</div>`:'')}
const OV={
 title:(o,lt)=>`<div class="ttl" style="top:300px;${st(lt,.05)}">${o.n?`<span class="tag" style="font-size:80px">${o.n}</span>`:''}<div style="font-size:${o.size||140}px;margin-top:30px">${o.s}</div></div>`,
 big:(o,lt)=>`<div class="ttl" style="top:250px;font-size:${o.size||170}px;${st(lt,.3)}"><em>${o.s}</em></div>${o.sub?`<div class="ttl" style="top:${o.size?250+o.size*1.1:460}px;font-size:60px;${st(lt,1.2)}">${o.sub}</div>`:''}`,

 call:(o,lt)=>`<div class="card" style="left:1400px;top:90px;width:430px;padding:30px;background:rgba(18,30,58,.95);color:#fff;text-align:center;${st(lt,.2)}"><div style="font:800 44px Inter">${o.from}</div><div style="font:500 28px Inter;color:#9fb3d6;margin-top:6px">${o.sub||'mobile · calling…'}</div><div style="margin:24px auto 0;width:110px;height:110px;border-radius:50%;background:#30d158;display:flex;align-items:center;justify-content:center;font-size:56px;transform:scale(${1+.08*Math.sin(lt*10)})">📞</div></div>`,
 stamp:(o,lt)=>`<div class="stamp" style="${st(lt,o.at??.1)};transform:rotate(-4deg) scale(${pop(lt,o.at??.1)||.001});${o.size?`font-size:${o.size}px`:''}">${o.s}</div>`,
 tag:(o,lt)=>`<div style="position:absolute;left:0;right:0;top:${o.y||130}px;text-align:center;${st(lt,o.at??.4)}"><span class="tag" style="font-size:${o.size||60}px;background:${col[o.c||'red']};color:${ink[o.c||'red']}">${o.s}</span></div>`,
 head:(o,lt)=>`<div class="ttl" style="top:${o.y||120}px;font-size:${o.size||90}px;${st(lt,o.at??.3)}">${o.s}</div>`,
 quote:(o,lt)=>`<div class="card" style="left:110px;top:110px;width:1000px;padding:36px 44px;${st(lt,o.at??.3)}">${o.label?`<div style="font:700 28px Inter;color:#777">${o.label}</div>`:''}<div style="font:900 56px/1.12 Inter;margin-top:10px">${o.s}</div></div>`,
 list:(o,lt,s)=>(o.h?`<div class="ttl" style="top:100px;font-size:80px;${st(lt,.1)}">${o.h}</div>`:'')+o.items.map((w,i)=>`<div class="chk" style="top:${(o.h?260:150)+i*(o.gap||105)}px;${st(lt,stag(o,i,o.items.length,s))}">${w.replace(/^✓/,'<span style="color:#30d158">✓</span>').replace(/^✗/,'<em>✗</em>')}</div>`).join(''),
 chips:(o,lt,s)=>(o.h?`<div class="ttl" style="top:200px;font-size:100px;${st(lt,.1)}">${o.h}</div>`:'')+o.items.map((w,i)=>`<div style="position:absolute;left:0;right:0;top:${420+i*120}px;text-align:center;${st(lt,stag(o,i,o.items.length,s))}"><span class="tag" style="font-size:56px;background:${col[o.c||'red']};color:${ink[o.c||'red']}">${w}</span></div>`).join(''),
 lower:(o,lt)=>`<div class="lower" style="opacity:${P(lt,.6,.3)};transform:translateX(${(1-e3(P(lt,.6,.5)))*-700}px)"><div class="a">${o.a||'LENNY'}</div><div class="b">${o.b}</div></div>`,
 sub:(o,lt)=>`<div style="position:absolute;left:0;right:0;top:160px;text-align:center;opacity:${P(lt,.6,.3)};transform:scale(${pop(lt,.6)||.001})"><span style="display:inline-block;background:#ff0000;color:#fff;font:900 76px Inter;border-radius:22px;padding:22px 56px;box-shadow:0 20px 60px rgba(0,0,0,.6)">▶ SUBSCRIBE</span></div>`,
 cards:(o,lt)=>cards(o,lt),
 end:(o,lt)=>`<div class="ttl" style="top:320px;font-size:110px;${st(lt,.1)}">${o.s}</div><div class="lower" style="top:700px;left:640px;opacity:${P(lt,.8,.3)}"><div class="a">LENNY</div><div class="b">see you in the next one</div></div>`,
};
window.render=function(t){
  const S=T.segs; let i=S.findIndex(s=>t>=s.start&&t<s.end); if(i<0)i=t<S[0].start?0:S.length-1; const s=S[i], lt=Math.max(0,t-s.start);
  const kb=(seg,idx,tt)=>{const d=seg.end-seg.start,p=Math.min(1,Math.max(0,tt/d)),k=idx%4;
    const s0=k%2?1.18:1.06,s1=k%2?1.06:1.18,dx=[40,-40,-30,30][k],dy=[10,-10,20,-20][k];
    return `scale(${s0+(s1-s0)*p}) translate(${dx*(p-.5)}px,${dy*(p-.5)}px)`};
  const bg=$('bg'); if(!bg.src.endsWith(s.img))bg.src=s.img;
  const cm=MOTION.cam(s,lt,t); bg.style.transformOrigin=cm.origin; bg.style.transform=cm.transform; bg.style.filter=s.dim?'brightness(.45) saturate(.9)':'none';
  const pv=i>0?S[i-1]:null, b2=$('bg2'), f=Math.min(1,lt/.2);
  if(pv&&f<1&&!s.flash){ if(!b2.src.endsWith(pv.img))b2.src=pv.img; b2.style.opacity=1; const pc=MOTION.cam(pv,pv.end-pv.start+lt,t); b2.style.transformOrigin=pc.origin; b2.style.transform=pc.transform+' scale('+(1+lt*.4)+')';
    b2.style.filter=pv.dim?'brightness(.45) saturate(.9)':'none'; bg.style.opacity=f; } else { b2.style.opacity=0; bg.style.opacity=1; }
  $('ov').innerHTML=s.ov?(OV[s.ov.t]||(()=>''))(s.ov,lt,s):'';
  $('flash').style.opacity=s.flash?Math.max(0,.5-lt*3):0;
  const cap=$('cap'), sp=t-s.voice;
  if(s.text&&sp>=0&&sp<s.dur+.1){const w=s.text.split(/\s+/),k=s.words&&s.words.length==w.length?Math.max(0,s.words.filter(x=>x<=sp+.04).length-1):Math.min(w.length-1,Math.floor(sp/s.dur*w.length)),c0=Math.floor(k/4)*4;
    cap.innerHTML=MOTION.caption(s,sp)} else cap.innerHTML='';
};
window.ready=()=>Promise.all(['bg','bg2'].map(id=>new Promise(r=>{const i=$(id);if(!i.src||i.complete)r();else{i.onload=()=>r();i.onerror=()=>r();setTimeout(r,3000)}})));
</script></body></html>
