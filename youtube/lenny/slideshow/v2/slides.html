function lerp(a,b,p){return a+(b-a)*p}
window.render=function(t){
  const S=T.segs; let i=S.findIndex(s=>t>=s.start&&t<s.end); if(i<0)i=t<S[0].start?0:S.length-1; const s=S[i], lt=Math.max(0,t-s.start);
  // still image with a slow Ken Burns move; crossfade from the previous slide
  const kb=(seg,idx,tt)=>{const d=seg.end-seg.start,p=Math.min(1,Math.max(0,tt/d)),k=idx%4;
    const s0=k%2?1.18:1.06,s1=k%2?1.06:1.18,dx=[40,-40,-30,30][k],dy=[10,-10,20,-20][k];
    return `scale(${s0+(s1-s0)*p}) translate(${dx*(p-.5)}px,${dy*(p-.5)}px)`};
  const bg=$('bg'); if(!bg.src.endsWith(s.img))bg.src=s.img;
  bg.style.transform=kb(s,i,lt); bg.style.transformOrigin='50% 50%';
  bg.style.filter=s.blur?'brightness(.5) saturate(.9)':'none';
  const pv=i>0?S[i-1]:null, b2=$('bg2'), f=Math.min(1,lt/.6);
  if(pv&&f<1){ if(!b2.src.endsWith(pv.img))b2.src=pv.img; b2.style.opacity=1; b2.style.transform=kb(pv,i-1,pv.end-pv.start+lt);
    b2.style.filter=pv.blur?'brightness(.5) saturate(.9)':'none'; bg.style.opacity=f; } else { b2.style.opacity=0; bg.style.opacity=1; }
  $('ov').innerHTML=(OV[s.kind]||(()=>''))(lt);
  // flash at hard cuts into titles
  $('flash').style.opacity=s.flash?Math.max(0,.5-lt*3):0;
  // captions
  const cap=$('cap'); const sp=t-s.voice;
  if(s.text&&sp>=0&&sp<s.dur+.1){const w=s.text.split(/\s+/),k=Math.min(w.length-1,Math.floor(sp/s.dur*w.length)),c0=Math.floor(k/4)*4;
    cap.innerHTML=w.slice(c0,c0+4).map((x,n)=>`<span class="${c0+n===k?'on':''}">${x}</span>`).join(' ')} else cap.innerHTML='';
};
window.ready=()=>Promise.all(['bg','bg2'].map(id=>new Promise(r=>{const i=$(id);if(!i.src||i.complete)r();else{i.onload=()=>r();i.onerror=()=>r();setTimeout(r,3000)}})));
