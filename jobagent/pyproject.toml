[project]
name = "jobagent"
version = "0.1.0"
description = "AI agent: ATS-friendly resume tailoring, vacancy matching and semi-automatic applications"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobagent = "jobagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
