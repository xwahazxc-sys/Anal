name: yt-collect

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "youtube/research/collect.py"
      - ".github/workflows/yt-collect.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U yt-dlp
      - run: python3 youtube/research/collect.py
      - name: Rank outliers per file
        run: |
          cd youtube/research/data
          for f in *_*.json; do
            echo "=== $f" >> outliers.txt
            python3 ../../../.claude/skills/yt-viral/swipe.py "$f" --min 2.0 >> outliers.txt || true
          done
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add youtube/research/data
          git commit -m "Add collected YouTube genre data" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
