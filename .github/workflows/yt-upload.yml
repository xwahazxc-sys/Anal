name: YouTube upload

# Uploads videos listed in youtube/lenny/publish/queue.json through YouTube Studio,
# signed in with the channel's cookies and routed through the channel's proxy.
# Secrets (Settings → Secrets and variables → Actions):
#   YT_COOKIES  contents of cookies.txt (Netscape format) for youtube.com
#   YT_PROXY    host:port:user:pass   (or http://user:pass@host:port)

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Queue ids to upload, comma-separated (e.g. ep02)"
        required: true
      text:
        description: "Comment text for pin=VIDEOID"
        required: false
        default: ""
      account:
        description: "Secret prefix: YT (Lenny), YTS (What If YouTube), TTS (TikTok)"
        required: false
        default: "YT"
  push:
    paths:
      - youtube/lenny/publish/run.json

permissions:
  contents: read

concurrency:
  group: yt-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.47.0 pproxy==2.7.9
          python -m playwright install --with-deps chromium
      # Google renews login cookies on every visit; replaying the stale secret gets the session revoked.
      # So each run saves the renewed cookies (encrypted with the proxy secret) to the Actions cache for the next run.
      # A new cookies secret changes the cache key, so fresh secrets always win.
      - name: Cookie state key
        id: ck
        env:
          C: ${{ secrets[format('{0}_COOKIES', github.event.inputs.account || 'YT')] }}
        run: echo "h=$(printf %s "$C" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore renewed cookies
        uses: actions/cache/restore@v4
        with:
          path: state/cookies.enc
          key: ck-${{ github.event.inputs.account || 'YT' }}-${{ steps.ck.outputs.h }}-${{ github.run_id }}
          restore-keys: ck-${{ github.event.inputs.account || 'YT' }}-${{ steps.ck.outputs.h }}-
      - name: Decrypt renewed cookies
        env:
          K: ${{ secrets[format('{0}_PROXY', github.event.inputs.account || 'YT')] || (startsWith(github.event.inputs.account, 'YTS') && secrets.YT4_PROXY) || (startsWith(github.event.inputs.account, 'TTS') && secrets.TT_PROXY) || secrets.YT2_PROXY }}
        run: |
          if [ -f state/cookies.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:K -in state/cookies.enc -out state/cookies.json || rm -f state/cookies.json
          fi
      - name: Upload
        env:
          YT_COOKIES: ${{ secrets[format('{0}_COOKIES', github.event.inputs.account || 'YT')] }}
          # YTS = second channel (proxy of YT4), TTS = TikTok (proxy of TT)
          YT_PROXY: ${{ secrets[format('{0}_PROXY', github.event.inputs.account || 'YT')] || (startsWith(github.event.inputs.account, 'YTS') && secrets.YT4_PROXY) || (startsWith(github.event.inputs.account, 'TTS') && secrets.TT_PROXY) || secrets.YT2_PROXY }}
          ACCOUNT: ${{ github.event.inputs.account || 'YT' }}
          QUEUE_DIR: ${{ (github.event.inputs.account == 'YT3' || github.event.inputs.account == 'YT4' || startsWith(github.event.inputs.account, 'YTS') || startsWith(github.event.inputs.account, 'TT')) && 'youtube/whatif/publish' || 'youtube/lenny/publish' }}
          IDS: ${{ github.event.inputs.ids }}
          PIN_TEXT: ${{ github.event.inputs.text }}
        run: |
          if [ "${ACCOUNT#TT}" != "$ACCOUNT" ]; then python youtube/publish/tiktok.py; else python youtube/lenny/publish/uploader.py; fi
      - name: Encrypt renewed cookies
        if: always()
        env:
          K: ${{ secrets[format('{0}_PROXY', github.event.inputs.account || 'YT')] || (startsWith(github.event.inputs.account, 'YTS') && secrets.YT4_PROXY) || (startsWith(github.event.inputs.account, 'TTS') && secrets.TT_PROXY) || secrets.YT2_PROXY }}
        run: |
          if [ -s state/cookies.json ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:K -in state/cookies.json -out state/cookies.enc
          fi
          rm -f state/cookies.json
      - name: Save renewed cookies
        if: always() && hashFiles('state/cookies.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: state/cookies.enc
          key: ck-${{ github.event.inputs.account || 'YT' }}-${{ steps.ck.outputs.h }}-${{ github.run_id }}
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-upload-shots
          path: shots/
          retention-days: 7
