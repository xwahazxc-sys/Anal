name: yt-collect-twins

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "youtube/research/collect_twins.py"
      - "youtube/research/collect_de.py"
      - "youtube/research/collect_lang.py"
      - ".github/workflows/yt-collect-twins.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U yt-dlp
      - run: python3 youtube/research/collect_twins.py twins4.json && python3 youtube/research/collect_lang.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add youtube/research/full
          git commit -m "Add collected YouTube twin-film check" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME}
