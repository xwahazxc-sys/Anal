name: yt-scan

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "youtube/research/collect_scan.py"
      - "youtube/research/scan/films.json"
      - ".github/workflows/yt-scan.yml"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U yt-dlp
      - run: python3 youtube/research/collect_scan.py
        continue-on-error: true
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add youtube/research/scan
          git commit -m "Add rights-management scan results" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME}
